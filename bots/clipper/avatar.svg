<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="128" height="128"><style>
.body { transform-origin: 30px 30px; animation: breathe 3.2s ease-in-out var(--d, 0s) infinite; }
.look { animation: look 8s ease-in-out var(--d, 0s) infinite; }
.blink { transform-box: fill-box; transform-origin: center; animation: blink 8s var(--d, 0s) infinite; }
@keyframes breathe { 50% { transform: scale(1.05); } }
@keyframes look {
  0%, 10% { transform: translate(0, 0); }
  16%, 32% { transform: translate(-2.6px, -0.4px); }
  38%, 48% { transform: translate(0, 0); }
  54%, 70% { transform: translate(2.6px, 0.6px); }
  76%, 86% { transform: translate(1.2px, -1.8px); }
  92%, 100% { transform: translate(0, 0); }
}
@keyframes blink {
  0%, 34%, 38%, 88%, 92%, 100% { transform: scaleY(1); }
  36%, 90% { transform: scaleY(0.12); }
}
@media (prefers-reduced-motion: reduce) { .body, .look, .blink { animation: none; } }

@media (prefers-color-scheme: dark) {
  .cyan .skin { fill: #00A592; color: #00A592; }
  .eye { fill: #000000; }
}
</style><g class="body cyan"><g class="skin" fill="#1CC3B0" color="#1CC3B0"><ellipse cx="32.85" cy="19.37" rx="12" ry="7" transform="rotate(-90 32.85 19.37)"/><ellipse cx="40.63" cy="32.85" rx="12" ry="7" transform="rotate(0 40.63 32.85)"/><ellipse cx="27.15" cy="40.63" rx="12" ry="7" transform="rotate(90 27.15 40.63)"/><ellipse cx="19.37" cy="27.15" rx="12" ry="7" transform="rotate(180 19.37 27.15)"/><circle cx="30" cy="30" r="9"/></g><g class="look"><g transform="rotate(7 25.00 29)"><rect class="blink eye" x="22.75" y="24.00" width="4.5" height="10" rx="2.25" fill="#FFFFFF"/></g><g transform="rotate(7 35.00 29)"><rect class="blink eye" x="32.75" y="24.00" width="4.5" height="10" rx="2.25" fill="#FFFFFF"/></g></g></g></svg>
